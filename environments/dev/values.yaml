replicaCount: 1
app:
  environment: dev
image:
  tag: "d82852a"
  repository: docker.io/mrattdevops/gitops-advanced-app

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50

monitoring:
  enabled: true

vault:
  enabled: true
  role: python-dev
  secretPath: secret/data/python-api/dev

serviceMonitor:
  enabled: true

keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  threshold: "100"
  prometheusServer: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  query: 'sum(rate(http_requests_total{namespace="gitops-dev",service="python-api-dev"}[2m])) * 60'
