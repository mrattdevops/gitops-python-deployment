replicaCount: 1
app:
  environment: dev
image:
  tag: "45daf59"
  repository: docker.io/mrattdevops/gitops-advanced-app
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_minute
        target:
          type: AverageValue
          averageValue: "100"
monitoring:
  enabled: true
vault:
  enabled: true
  role: python-dev
  secretPath: secret/data/python-api/dev
serviceMonitor:
  enabled: true
