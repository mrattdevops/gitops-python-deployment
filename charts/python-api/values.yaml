replicaCount: 1

image:
  repository: docker.io/mrattdevops/gitops-advanced-app
  pullPolicy: IfNotPresent
  tag: "v1"

serviceAccount:
  create: true
  automount: false

service:
  type: ClusterIP
  port: 80

containerPort: 8080

app:
  environment: dev

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: false

monitoring:
  enabled: false

vault:
  enabled: false
  role: ""
  secretPath: ""

keda:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  threshold: "100"
  prometheusServer: ""
  query: ""
