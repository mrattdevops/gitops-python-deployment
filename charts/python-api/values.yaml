replicaCount: 1

image:
  repository: docker.io/mrattdevops/gitops-advanced-app
  pullPolicy: IfNotPresent
  tag: "v1"

serviceAccount:
  create: true
  automount: false

service:
  type: ClusterIP
  port: 80

containerPort: 8080

app:
  environment: dev

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50
  # Empty metrics keeps CPU scaling available; environments can supply custom metrics.
  metrics: []
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120

ingress:
  enabled: false

monitoring:
  enabled: false

serviceMonitor:
  enabled: false

vault:
  enabled: false
  role: ""
  secretPath: ""
