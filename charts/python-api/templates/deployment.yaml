
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-containers: "python-api"
        vault.hashicorp.com/template-static-secret-render-interval: "30s"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/role: {{ required "vault.role is required when vault.enabled=true" .Values.vault.role | quote }}
        vault.hashicorp.com/service: "http://vault-active.vault.svc.cluster.local:8200"
        vault.hashicorp.com/agent-inject-secret-config: {{ required "vault.secretPath is required when vault.enabled=true" .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-file-config: "config"
        # The appuser UID differs from Vault Agent's UID; only python-api
        # receives the application mount. Do not share the Vault token.
        vault.hashicorp.com/agent-inject-perms-config: "0644"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ printf "{{- with secret %q -}}" .Values.vault.secretPath }}
          {{ "{{ .Data.data | toJSON }}" }}
          {{ "{{- end -}}" }}
      {{- end }}
    spec:
      serviceAccountName: python-api
      automountServiceAccountToken: {{ .Values.vault.enabled }}

      containers:
        - name: python-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          env:
            - name: APP_ENV
              value: {{ .Values.app.environment | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}

          {{- if .Values.vault.enabled }}
          # Keep the Pod unready if a fail-open webhook skips injection.
          # With successful injection, vault-agent-init renders before startup.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s /vault/secrets/config && test -r /vault/secrets/config
            periodSeconds: 5
            failureThreshold: 30
          {{- end }}

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
